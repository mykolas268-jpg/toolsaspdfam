name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Install Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Tests
        run: python -m pytest -q
      - name: Smoke build (every page type)
        run: guidekit build tests/fixtures/showcase
      - name: Contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheets-${{ matrix.os }}
          path: tests/fixtures/showcase/out/qa/*.jpg
          if-no-files-found: ignore
