- id: acsm-2009
  citation: "American College of Sports Medicine (2009). Position stand: Progression models in resistance training for healthy adults."
  venue: "Med Sci Sports Exerc 41(3):687-708"
  url: https://journals.lww.com/acsm-msse/Fulltext/2009/03000/Progression_Models_in_Resistance_Training_for.26.aspx
  short: "MSSE 2009;41(3):687-708"
  type: position_stand
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "Novices: loads of 8-12 RM; frequency 2-3 days per week for novice training. Progression: add 2-10% load when the current workload can be done for 1-2 reps over the target on two consecutive sessions. (Snippets disagreed on novice sets and rest periods, so those are not used.)"

- id: acsm-2026
  citation: "Phillips SM, et al. (2026). ACSM Position Stand. Resistance training prescription for muscle function, hypertrophy, and physical performance in healthy adults: an overview of reviews."
  venue: "Med Sci Sports Exerc"
  url: https://pubmed.ncbi.nlm.nih.gov/41843416/
  short: pubmed/41843416
  type: position_stand
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "First major update since 2009; 137 systematic reviews, more than 30,000 participants. The most meaningful gains come from moving from no resistance training to any; train all major muscle groups at least 2 days per week and build gradually (ACSM news release and infographic)."

