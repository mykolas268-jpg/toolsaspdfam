- id: harvard-warning-signs
  citation: "Harvard Health Publishing. Safe exercise: Know the warning signs of pushing too hard."
  venue: "health.harvard.edu"
  url: https://www.health.harvard.edu/pain/safe-exercise-know-the-warning-signs-of-pushing-too-hard
  short: health.harvard.edu
  type: education
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "Red flags: chest pain, shortness of breath, lightheadedness and joint pain; any of these during activity means stop exercising and call a doctor. Pushing through symptoms may damage the heart or muscles. Call a doctor or 911 for notable dizziness or faintness, chest pain, or significant or persistent shortness of breath."
