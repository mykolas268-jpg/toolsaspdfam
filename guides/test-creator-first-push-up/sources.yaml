# --------------------------------------------------------------------------- peer-reviewed
- id: ebben-2011
  citation: "Ebben WP, Wurm B, VanderZanden TL, et al. (2011). Kinetic analysis of several variations of push-ups."
  venue: "J Strength Cond Res"
  url: https://pubmed.ncbi.nlm.nih.gov/21873902/
  short: pubmed/21873902
  type: peer_reviewed
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "23 recreationally fit adults (14 men, 9 women), force plate. Peak vertical force as a share of body mass: hands on 61 cm box 41%, knees 49%, hands on 30.5 cm box 55%, regular 64%, feet on 30.5 cm box 70%, feet on 61 cm box 74%. Height mattered only with hands on the 60.96 cm box (r = 0.63). The percentages were stated in search summaries of this study, not confirmed in the PubMed abstract text."

- id: suprak-2011
  citation: "Suprak, Dawes & Stephenson (2011). The effect of position on the percentage of body mass supported during traditional and modified push-up variants."
  venue: "J Strength Cond Res"
  url: https://pubmed.ncbi.nlm.nih.gov/20179649/
  short: pubmed/20179649
  type: peer_reviewed
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "28 highly strength-trained men, static holds on a force platform. Traditional push-up: 69.16% of body mass on the hands at the top, 75.04% at the bottom. Knee (modified) push-up: 53.56% top, 61.80% bottom."

- id: mier-2014
  citation: "Mier, Amasay, Garner & Capehart (2014). Differences between men and women in percentage of body weight supported during push-up exercise."
  venue: "Int J Exerc Sci"
  url: https://digitalcommons.wku.edu/cgi/viewcontent.cgi?article=1582&context=ijes
  short: "IJES 7(2):161-168"
  type: peer_reviewed
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "37 men and women. Static top: standard 67.0% (men) vs 65.1% (women) of body weight; knee 52.5% vs 51.5%. Static bottom: standard 74.6% vs 70.3%; knee 60.1% vs 56.6%. Peak during moving reps: standard 97.7% vs 80.0%; knee 79.7% vs 68.2%."

- id: kowalski-2022
  citation: "Kowalski KL, Connelly DM, Jakobi JM, Sadi J (2022). Shoulder electromyography activity during push-up variations: a scoping review."
  venue: "Shoulder Elbow"
  url: https://pubmed.ncbi.nlm.nih.gov/35599715/
  short: pubmed/35599715
  type: peer_reviewed
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "303 articles screened, 30 included; six push-up types and five muscles analyzed. Triceps and pectoralis major had the highest EMG amplitude during unstable, suspension, incline-with-hands-on-ball and standard push-ups; serratus anterior was highest during push-up plus and incline push-ups."

- id: kikuchi-2017
  citation: "Kikuchi & Nakazato (2017). Low-load bench press and push-up induce similar muscle hypertrophy and strength gain."
  venue: "J Exerc Sci Fit"
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5812864/
  short: PMC5812864
  type: peer_reviewed
  verified_how: "search snippet only; page not opened (cloud egress blocked)"
  verified_on: 2026-09-25
  bias: none
  says: "18 men aged 19 to 22, randomized: bench press at 40% 1RM (n = 9) or push-ups with position adjusted (e.g. kneeling) to the same load (n = 9), twice a week for 8 weeks. Pectoral size rose 18.3% (push-up) vs 19.4% (bench), no significant difference; title reports similar strength gain."

